name: CI

# Pull requests and pushes to main. Tags are handled by release.yml, which runs
# these same checks before it publishes anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The real gate. Everything builds here, including the Wayland adapter, and
  # the whole suite runs.
  linux:
    name: Linux (full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The overlay links libxkbcommon for keysym handling. Wayland itself
      # needs nothing: the pure-Rust backend is used, so libwayland-client is
      # never linked. See crates/ink-platform-wayland/Cargo.toml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

      # Reference integrity across the specification files. It cannot certify
      # that anything was implemented, and says so in its own output.
      - name: Validate specification cross-references
        run: python3 tools/check_specs.py

  # Keeps the portable crates portable, and builds and links the Windows and
  # macOS backends. It does not prove either backend works: nobody has run
  # them, and a runner cannot (T003, T004). See docs/ship-it.md.
  portable:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A clean run takes minutes. Without a limit, the hang described below
    # cost six hours per job per push before anyone noticed.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Named one by one rather than --workspace, because the workspace
      # contains the Wayland adapter and the throwaway experiment, neither of
      # which can build off Linux. Excluding them by listing what is portable
      # means adding a crate is a deliberate decision about which list it
      # belongs in.
      # Both platform probes are linted on both runners. Each one's bindings
      # are target-gated, so on the other platform it is a stub -- which is
      # worth compiling too, because a broken cfg gate would otherwise only
      # show up as a mysterious failure on the development machine.
      - name: Lint
        run: >
          cargo clippy --all-targets
          -p ink-core -p ink-app -p ink-render -p ink-storage -p ink-platform
          -p ink-platform-windows -p ink-platform-macos -p ink-ui -p yappyink
          -p exp-windows-layered -p exp-macos-overlay
          -- -D warnings

      # Both platform adapters are tested on both runners on purpose. Their
      # key translation and buffer arithmetic take no platform types, so they
      # run anywhere, and that is the whole reason they were separated out.
      - name: Test
        run: >
          cargo test
          -p ink-core -p ink-app -p ink-render -p ink-storage -p ink-platform
          -p ink-platform-windows -p ink-platform-macos -p ink-ui -p yappyink

      # Proves the binary links and runs off Linux, and that doctor tells the
      # truth about the backend it carries.
      #
      # `draw` is deliberately not run. Until 0.6.0 this step ran it and
      # expected a failure, because there was no backend. Once the Windows and
      # macOS backends landed, `draw` opened a real overlay on a runner with no
      # one to close it, and both jobs sat until the six-hour limit for five
      # pushes in a row. A headless runner cannot say anything about an overlay
      # anyway: every question it would answer is about what a person sees.
      - name: The binary runs, and doctor admits what it has not seen
        shell: bash
        run: |
          cargo run -q -p yappyink -- version
          report=$(cargo run -q -p yappyink -- doctor)
          echo "$report"
          if ! grep -q "backend is compiled in" <<<"$report" || ! grep -q "unknown" <<<"$report"; then
            echo "doctor no longer reports the backend, or claims every capability; if something"
            echo "has been confirmed, record the evidence and change this check with it"
            exit 1
          fi
