name: Release

# A pushed v* tag is the only thing that publishes. Pushing to a branch never
# does. See docs/ship-it.md.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Refuses to release a tag that disagrees with the version in the tree.
  # The rule is that every release bumps the version, and a rule with nothing
  # enforcing it is a preference. Cheap to check, and it fails before anything
  # is published rather than after.
  verify-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "tag=$tagged declared=$declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $declared."
            echo "::error::Bump the version and retag; do not move a pushed tag."
            exit 1
          fi

  # The same gate as CI. A release that skipped the checks is not worth the
  # tag, and re-running them costs minutes.
  checks:
    name: Checks
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 tools/check_specs.py

  build:
    name: ${{ matrix.artifact }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu, because a binary needs the
          # glibc of the system it was built on or newer. Built on 24.04 it
          # needed glibc 2.39 and would not start on 22.04.
          - os: ubuntu-22.04
            artifact: yappyink-x86_64-linux
            binary: yappyink
          # Both carry an overlay backend with nothing confirmed on screen (T003, T004).
          - os: windows-latest
            artifact: yappyink-x86_64-windows.exe
            binary: yappyink.exe
          - os: macos-latest
            artifact: yappyink-aarch64-macos
            binary: yappyink
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p yappyink

      # Refuses a Linux binary that would not start on Ubuntu 22.04.
      - name: The Linux binary runs, and needs no glibc newer than 2.35
        if: runner.os == 'Linux'
        run: |
          ./target/release/yappyink version
          needed=$(objdump -T target/release/yappyink | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $needed"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$needed" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::$needed is newer than Ubuntu 22.04's glibc 2.35"
            exit 1
          fi

      - name: Name it after the platform it was built for
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Written here rather than taken from the tag message, so that the
      # limitations travel with every download. Somebody will find this page
      # without having read the README.
      # The GNOME Shell extension, as a zip `gnome-extensions install` accepts:
      # metadata.json at the root. Without it a release user had to clone the
      # repository to get the one thing that makes GNOME behave.
      - name: Package the GNOME extension
        run: |
          cd integrations/gnome/yappyink@algorisys-oss.github.io
          zip -r "$GITHUB_WORKSPACE/dist/yappyink-gnome-extension.zip" .

      - name: Compose the notes
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          ## What runs where

          | Download | What it does |
          |---|---|
          | `yappyink-x86_64-linux` | the overlay, on GNOME Wayland. Used and tested by hand |
          | `yappyink-x86_64-windows.exe` | the overlay. **Drawing, pass-through, the chords and fullscreen seen working on one machine** |
          | `yappyink-aarch64-macos` | the overlay. **Drawing, pass-through, the chords and fullscreen seen working on one Mac** |

          **Windows and macOS are barely tested.** On each, one user has seen
          the overlay stay above other windows and draw
          (`docs/evidence/E010-first-windows-run.md`,
          `docs/evidence/E011-first-macos-drawing.md`); nothing else is
          confirmed. Both backends are complete enough to try: drawing, every tool, the toolbar, undo, save and load, and a
          global chord to get back from pass-through (Ctrl+Alt+D on Windows,
          Control+Option+D on macOS). They compile, pass their unit tests, and
          link on real Windows and macOS CI runners. None of that shows an
          overlay on a screen. The one macOS launch so far, on 0.6.0, found
          the screen and then appeared to freeze, for reasons fixed since
          (`docs/evidence/E009-first-macos-launch.md`). Every capability
          `yappyink doctor` reports as `unknown` stays that way until someone
          runs it and records what they saw. If you try one, that report is the most
          useful thing you can send.

          On Linux this is a **limited preview on GNOME**. It cannot choose
          which monitor it appears on, and it cannot raise itself: you apply
          *Always on Top* once per launch, or use the GNOME Shell extension in
          `integrations/gnome/`. Both limits are measured rather than assumed —
          see `docs/evidence/` and `docs/adr/ADR-002-gnome.md`.

          Nothing is signed or notarised. Windows SmartScreen will warn, and
          macOS will refuse the binary until you clear it by hand.

          **To start it, double-click the download** or run it with no
          arguments: the overlay and toolbar open. `yappyink help` lists the
          other commands.

          Run `chmod +x` on the Linux and macOS downloads.

          ## Installing on Ubuntu

          Needs **Ubuntu 22.04 or newer**, in the default GNOME (Wayland)
          session. Nothing else to install on a standard desktop.

          ```sh
          chmod +x yappyink-x86_64-linux
          ./yappyink-x86_64-linux
          ```

          **Strongly recommended on GNOME:** the extension, which keeps the
          overlay above other windows, on every workspace, across the whole
          monitor. Without it you apply *Always on Top* by hand each launch.
          It declares GNOME Shell 46, which Ubuntu 24.04 ships.

          ```sh
          gnome-extensions install yappyink-gnome-extension.zip
          ```

          Then log out and back in, and run
          `gnome-extensions enable yappyink@algorisys-oss.github.io`.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "yappyink $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --prerelease \
            dist/*
