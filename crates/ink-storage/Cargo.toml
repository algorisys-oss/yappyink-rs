[package]
name = "ink-storage"
description = "Reads and writes the versioned local document file. Validates before it replaces anything."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ink-core.workspace = true
# The file format is described by its own types in `wire`, not by deriving on
# the domain, so `ink-core` keeps its zero dependencies and the format can
# change without the domain changing. See docs/toolchain-and-dependencies.md.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
