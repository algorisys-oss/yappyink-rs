[package]
name = "ink-render"
description = "Turns a document into pixels. Software rasteriser; no GPU, no OS, no window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ink-core.workspace = true
# Glyph rasterisation for the text tool. Chosen over a shaping stack because it
# rasterises straight to a coverage bitmap, which is the form this renderer
# already composites in, and because it is pure Rust with a small tree. It does
# not shape or do font fallback; complex scripts need more than this and will
# arrive with IME support. See docs/toolchain-and-dependencies.md.
fontdue = "0.9.4"
