[package]
name = "yappyink"
description = "yappyink: a screen-annotation overlay. Binary entry point; the overlay lives in the ink-platform-* crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yappyink"
path = "src/main.rs"

[dependencies]
ink-app.workspace = true
ink-core.workspace = true
ink-platform.workspace = true
ink-storage.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ink-platform-wayland.workspace = true

[target.'cfg(windows)'.dependencies]
ink-platform-windows.workspace = true
