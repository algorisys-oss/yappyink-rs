[workspace]
resolver = "3"
members = [
    "crates/ink-app",
    "crates/ink-core",
    "crates/ink-platform",
    "crates/ink-render",
    "crates/ink-storage",
    "crates/ink-platform-wayland",
    "apps/yappyink",
    "experiments/gnome-xdg-shell",
    "experiments/windows-layered",
    "experiments/macos-overlay",
]

[workspace.package]
# Versioning started at 0.3.0 on 2026-09-24; see docs/ship-it.md for the scheme
# and why the first number is not 0.1.0. Bumped on every release, without
# exception: an unbumped release overwrites the meaning of the previous tag.
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
ink-app = { path = "crates/ink-app" }
ink-core = { path = "crates/ink-core" }
ink-platform = { path = "crates/ink-platform" }
ink-render = { path = "crates/ink-render" }
ink-storage = { path = "crates/ink-storage" }
ink-platform-wayland = { path = "crates/ink-platform-wayland" }

[profile.release]
debug = 1
