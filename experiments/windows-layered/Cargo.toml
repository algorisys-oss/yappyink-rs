[package]
name = "exp-windows-layered"
description = "T003 step 1: throwaway experiment measuring whether a layered top-most window can meet the overlay contract on Windows. Delete once T003 is settled."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Target-gated so the workspace still builds on Linux, where this program is a
# stub that explains itself and exits.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
